<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Reservation Tests</title>
<style>body{font-family:Arial,sans-serif;margin:40px auto;max-width:640px;padding:0 20px;color:#142d49}button{padding:14px;margin:8px;border:1px solid #183d78;background:#e6f1ff;cursor:pointer;font-size:16px;border-radius:6px}</style></head>
<body><h1>Local Reservation Tests</h1><p>Sample events only. No live database or emails.</p><button id="trios">Trios</button><button id="doubles">Doubles</button><button id="singles">Singles</button><button id="full">Trios: Only 2 Spots Left</button><button id="champions">Trios: Champion Limit</button>
<script>
function seed(style, occupied = 0, championLimit = false) {
  const info = {name: `Local ${style} reservation test`, scheduleEventId: 'test-event', date:'2026-11-01', startTime:'09:00', center:'Bayside Bowl', location:'58 Alder St, Portland, ME', tournamentStyle:style, reservationEligibility:'open', series:'Test', season:'2026', lanesUsed:'1-8'};
  info.maxPreviousChampions = championLimit ? 2 : null;
  localStorage.setItem('bowler-builders-manual-title-history-v1', JSON.stringify(['Champion One','Champion Two','Champion Three'].map((bowler,i)=>({id:`title-${i}`,bowler,tournament:`Past Event ${i+1}`}))));
  const reservations = Array.from({length:occupied}, (_,i)=>({id:`existing-${i}`, name:`Existing Bowler ${i+1}`, email:'', status:'Registered', tournamentKey:'test-event', registrationNumber:i+1}));
  const reservationState = {tournamentKey:'test-event', tournamentName:info.name, tournamentDate:info.date, tournamentStartTime:info.startTime, tournamentCenter:info.center, reservationLimit:12, entriesOpen:true, reservations, reservationCount:occupied, reservationNextNumber:occupied+1, publicTournamentInfo:info, openTournamentKeys:['test-event'], reservationsByTournament:{}};
  const scheduleItems = [{id:'test-event', eventId:'test-event', name:info.name, startDate:info.date, startTime:info.startTime, center:info.center, publicInfo:info, reservationSettings:{entriesOpen:true,reservationLimit:12}}];
  localStorage.setItem('bowler-builders-tournament-app-v1',JSON.stringify({tournamentInfo:info,tournamentFormat:'bracket',qualifyingGames:4,bowlers:[],reservationState,scheduleItems,sidePotState:{},payoutState:{}}));
  location.href='/?view=public&tab=publicreservations';
}
document.getElementById('trios').onclick=()=>seed('trios');
document.getElementById('doubles').onclick=()=>seed('doubles');
document.getElementById('singles').onclick=()=>seed('singles');
document.getElementById('full').onclick=()=>seed('trios',10);
document.getElementById('champions').onclick=()=>seed('trios',0,true);
</script></body></html>
